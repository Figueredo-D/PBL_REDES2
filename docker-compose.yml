version: '3.8'

services:
  server_a:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: server_a
    environment:
      - SERVER_ID=SERVER_A
      - CLIENT_PORT=8080
      - INTERNAL_PORT=9080
      - PEERS=SERVER_B=http://server_b:9081,SERVER_C=http://server_c:9082
      - DATA_DIR=/app/data
    ports:
      - "8080:8080"
      - "9080:9080"
    volumes:
      - ./data/SERVER_A:/app/data/SERVER_A
    networks:
      - consorcio-net
    restart: unless-stopped

  server_b:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: server_b
    environment:
      - SERVER_ID=SERVER_B
      - CLIENT_PORT=8081
      - INTERNAL_PORT=9081
      - PEERS=SERVER_A=http://server_a:9080,SERVER_C=http://server_c:9082
      - DATA_DIR=/app/data
    ports:
      - "8081:8081"
      - "9081:9081"
    volumes:
      - ./data/SERVER_B:/app/data/SERVER_B
    networks:
      - consorcio-net
    restart: unless-stopped

  server_c:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: server_c
    environment:
      - SERVER_ID=SERVER_C
      - CLIENT_PORT=8082
      - INTERNAL_PORT=9082
      - PEERS=SERVER_A=http://server_a:9080,SERVER_B=http://server_b:9081
      - DATA_DIR=/app/data
    ports:
      - "8082:8082"
      - "9082:9082"
    volumes:
      - ./data/SERVER_C:/app/data/SERVER_C
    networks:
      - consorcio-net
    restart: unless-stopped

  driver_client:
    build:
      context: .
      dockerfile: Dockerfile
      target: driver-client
    container_name: driver_client
    stdin_open: true
    tty: true
    environment:
      - SERVER_A_ADDR=server_a:8080
      - SERVER_B_ADDR=server_b:8081
      - SERVER_C_ADDR=server_c:8082
    depends_on:
      - server_a
      - server_b
      - server_c
    networks:
      - consorcio-net

  passenger_client:
    build:
      context: .
      dockerfile: Dockerfile
      target: passenger-client
    container_name: passenger_client
    stdin_open: true
    tty: true
    environment:
      - SERVER_A_ADDR=server_a:8080
      - SERVER_B_ADDR=server_b:8081
      - SERVER_C_ADDR=server_c:8082
    depends_on:
      - server_a
      - server_b
      - server_c
    networks:
      - consorcio-net

networks:
  consorcio-net:
    driver: bridge
